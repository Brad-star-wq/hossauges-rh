<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hossauges — Pre-order Pop-up Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F3EA; --paper:#FFFDF7; --navy:#2C4A66; --navy-deep:#1E3349;
    --ember:#E2552C; --smoke:#6B7280; --char:#20242B;
    --display:'Big Shoulders Display',sans-serif; --body:'Archivo',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--cream);font-family:var(--body);color:var(--char);min-height:100vh;}
  .page-hint{position:fixed;inset:0;background:var(--navy-deep);overflow:hidden;}
  .page-hint .nav{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;}
  .page-hint .logo{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.5px;color:var(--cream);}
  .page-hint .logo .o{color:var(--ember);}
  .page-hint .menu{font-family:var(--mono);font-size:13px;letter-spacing:3px;color:var(--cream);opacity:.7;}
  .switcher{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;
    background:var(--paper);border:1px solid var(--navy);padding:8px 10px;align-items:center;}
  .switcher span{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--smoke);margin-right:4px;}
  .switcher button{font-family:var(--mono);font-size:12px;letter-spacing:1px;border:1px solid var(--navy);
    background:transparent;color:var(--navy);padding:6px 12px;cursor:pointer;}
  .switcher button.on{background:var(--ember);border-color:var(--ember);color:var(--cream);}
  .overlay{position:fixed;inset:0;background:rgba(20,30,45,.66);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;}
  .modal{background:var(--paper);width:100%;max-width:540px;border:2px solid var(--navy);
    box-shadow:14px 14px 0 rgba(30,51,73,.18);position:relative;animation:rise .4s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  .modal .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border:1px solid var(--navy);
    background:transparent;color:var(--navy);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--mono);}
  .modal .x:hover{background:var(--ember);border-color:var(--ember);color:var(--cream);}
  .modal-head{padding:30px 34px 18px;border-bottom:1px dashed rgba(44,74,102,.3);}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:4px;color:var(--ember);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:"";width:7px;height:7px;background:var(--ember);border-radius:50%;}
  .title{font-family:var(--display);font-weight:800;font-size:38px;line-height:.98;color:var(--navy);text-transform:uppercase;margin-top:10px;letter-spacing:.5px;}
  .items{padding:30px 34px 14px;display:grid;gap:26px 22px;justify-content:center;
    grid-template-columns:repeat(var(--cols),minmax(0,118px));}
  .item{text-align:center;}
  .thumb{aspect-ratio:1;width:100%;background:var(--navy);overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--navy-deep);}
  .thumb span{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:rgba(247,243,234,.4);}
  .thumb.p1{background:linear-gradient(135deg,#3a5a78,#243d52);}
  .thumb.p2{background:linear-gradient(135deg,#7a3a2c,#4a241c);}
  .thumb.p3{background:linear-gradient(135deg,#5a6a4a,#3a4632);}
  .thumb.p4{background:linear-gradient(135deg,#6b5a3a,#473c24);}
  .item .name{font-family:var(--display);font-weight:700;font-size:13px;color:var(--char);margin-top:11px;line-height:1.05;text-transform:uppercase;letter-spacing:.3px;}
  .cta-wrap{padding:18px 34px 30px;}
  .cta{display:block;width:100%;background:var(--ember);color:var(--cream);border:none;font-family:var(--mono);font-size:14px;letter-spacing:3px;text-transform:uppercase;padding:18px;cursor:pointer;}
  .cta:hover{background:var(--navy);}
  .browse{display:block;text-align:center;margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--smoke);text-transform:uppercase;background:none;border:none;width:100%;cursor:pointer;}
  .browse:hover{color:var(--ember);}
  @media(max-width:540px){
    .items{grid-template-columns:repeat(min(var(--cols),2),minmax(0,1fr));}
    .title{font-size:32px;} .modal{box-shadow:9px 9px 0 rgba(30,51,73,.18);}
  }
</style>
</head>
<body>
  <div class="page-hint">
    <div class="nav"><div class="logo">HOSS<span class="o">AUGES</span></div><div class="menu">MENU</div></div>
  </div>
  <div class="switcher">
    <span>FLAVORS:</span>
    <button data-n="1">1</button>
    <button data-n="2">2</button>
    <button data-n="5" class="on">5</button>
    <button data-n="9">9</button>
  </div>
  <div class="overlay">
    <div class="modal">
      <button class="x" aria-label="Close">&#10005;</button>
      <div class="modal-head">
        <div class="eyebrow">Pre-order open</div>
        <div class="title">Holiday Pre-Order</div>
      </div>
      <div class="items" id="items"></div>
      <div class="cta-wrap">
        <button class="cta">Sign up for pre-order</button>
        <button class="browse">&#10005; &nbsp; Just browsing — close</button>
      </div>
    </div>
  </div>
<script>
  const FLAVORS = [
    ["Blueberry Gouda","p1"],["Maple Bacon","p2"],["French Onion","p3"],
    ["Philly Cheese","p4"],["Sweet Italian","p1"],["Peach Cobbler","p2"],
    ["Korean Bulgogi","p3"],["Hot Honey Brie","p4"],["Fajita Brisket","p1"]
  ];
  function colsFor(n){
    if(n<=1) return 1;
    if(n===2) return 2;
    if(n===3) return 3;
    if(n===4) return 2;
    return 3;
  }
  const itemsEl = document.getElementById('items');
  function render(n){
    itemsEl.style.setProperty('--cols', colsFor(n));
    itemsEl.innerHTML = FLAVORS.slice(0,n).map(function(f){
      return '<div class="item"><div class="thumb '+f[1]+'"><span>PHOTO</span></div><div class="name">'+f[0]+'</div></div>';
    }).join('');
  }
  document.querySelectorAll('.switcher button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.switcher button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); render(+b.dataset.n);
    };
  });
  render(5);
</script>
</body>
</html>
